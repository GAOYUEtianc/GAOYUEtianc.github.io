I have worked in traditional RL and bandits for years before LLM came out, but when I first looked at RLHF for LLMs, something felt off. It took me a while to realize the reason : LLM RLHF isn't a direct extension of traditional RL. It's a set of workarounds for the assumptions of traditional RL that simply don't hold in LLMs. Traditional RL usually assumes there’s a well-defined reward function, an environment that can be simulated, and meaningful multi-step transitions where credit assignment matters. In LLM RLHF, the reward is usually a learned model that approximates human preference, the environment is just the policy generating its own next token, and the reward usually only arrives at the end of a generation, making credit assignment over individual tokens loose.

There’s an evolution (and keep going on) on RLHF algorithms, from online PPO to offline DPO, then back to online GRPO to resolve some pitfalls caused by offline learning. To avoid getting lost in the forest of RLHF, it’s important to understand the motivations and pitfalls behind each selection.

## RLHF Is Actually A Contextual Bandit Problem

In traditional RL, an episode is usually hundreds of transitions with sparse rewards. But in LLM RLHF, an episode is the generation of one response, and the reward is only given at the end of generation by the reward model. There is no sequential horizon, and the reward ignores intermediate token-level state dynamics. Hence, RLHF can actually be formalized as a contextual bandit problem. Keeping this mindset will be helpful to understand why in PPO the advantage is reduced from a sequence of TD errors to a prompt-level baseline comparison, and why GRPO can directly cut the value network.
