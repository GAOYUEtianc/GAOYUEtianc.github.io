The intrinsic behind pretraining is to learn the distribution of next token from corpus, hence the data quality is essential. In general, "bad data" in pretraining corpus comes in three types, and each maps to a treatment method used in modern data pipelines :

- **Low quality** → ***quality filtering***
- **Redundant (duplicates)** → ***deduplication***
- **Skewed distribution** → ***reweighting***

This blog walks through the three treatments in the order they apply in a typical pre-training pipeline.

## Quality Filtering

Quality filtering is the first gate in the data pipeline. In practice they are stacked from cheap to expensive filters: rule-based heuristics catch obvious junk first, then a lightweight classifier learns fuzzier patterns, and finally perplexity based filtering measures distributional distance to a clean reference.

### Rule-based Heuristics

Rule-based filters run in MATHPLACEHOLDER9ENDMATH per document and are trivially parallel. They compute simple statistics per document like length, character-class ratios, sentence length distribution, then naively reject anything that falls outside a pre-defined range.

### Classifier-based Filtering

When rules miss subtle low-quality patterns, a trained classifier can take the job. The canonical recipe for classifier uses high-effort text (Wikipedia, books) as positives and random web scrape as negatives, then trains a lightweight model like FastText for per-document quality scoring.

### Perplexity-based Filtering

Train a small n-gram language model (KenLM is the standard) on a clean reference corpus.

Documents that receive very high perplexity are likely off-distribution, they're either garbage or valuable long-tail content, so this filter needs careful tuning to avoid throwing the latter away.

Documents that receive very low perplexity are likely to have too similar distribution, with a high risk of duplication, which needs to be judged with the deduplication methods in later sections.

### Safety Filtering

Safety filters aim to reduce exposure to NSFW, hateful, or unsafe content. This is orthogonal to quality filtering.

### Language Identification

Multilingual training requires routing documents to the correct language bucket. FastText's \`lid.176\` model outputs a language tag with a confidence score, and is of low latency.

## Deduplication

After removing low-quality junk, the next problem is redundancy. If the same content appearing many times across the corpus, the model will tend to memorize instead of generalize. Deduplication techniques scale from exact (a byte-perfect match) to fuzzy (near-duplicates with small edits) to substring-level (shared pattern embedded in otherwise different documents).

### Exact Deduplication

Exact deduplication is the cheapest layer, which normalizes documents to a canonical form (Unicode NFKC, whitespace collapse, lowercase), compute a SHA-256 hash, and drop any hash we have seen before. It catches byte-perfect duplicates, but also has an obvious drawback of missing anything with even a single character difference.

### Fuzzy Deduplication : MinHash + LSH

#### When to Use SimHash vs MinHash

SimHash is a good fit when :

- storage is tight (billions of documents)
- feature weights matter
- documents are long so that a single feature change does not distort the fingerprint too much

For strict shingle-based near-duplicate detection with a tunable Jaccard threshold, MinHash is more precise. A common industrial pipeline uses SimHash as a first-pass filter to shrink the candidate set, then applies MinHash + LSH for accurate verification.

### Substring-level Deduplication

Even after document level deduplication, two documents may share long identical passages like copyright notices, license text, template intros. Substring level deduplication uses a suffix array to locate and remove these shared blocks, and is usually the last and most expensive layer.

## Reweighting

Filtering and deduplication are hard decisions : a document is either kept or dropped. Reweighting is a soft alternative — assign each document (or domain) a training weight based on quality or importance, so lower-quality content contributes fewer gradient steps without being fully discarded.

### Domain Reweighting

A pretraining corpus is usually a mix of many domains (Wikipedia, code, books, C4 web, arXiv...), and how much weight each domain gets matters a lot for downstream performance. DoReMi automates this : instead of manually tuning weights, it trains a small proxy model together with a domain weight vector MATHPLACEHOLDER148ENDMATH, and reuses the resulting MATHPLACEHOLDER149ENDMATH to train the real target model.

The training is a min-max game : the proxy model tries to lower loss across all domains, while MATHPLACEHOLDER150ENDMATH pushes more weight onto the hard domains where the model still has room to improve. To avoid always chasing domains that are inherently noisy but not learnable (e.g., random web text), DoReMi measures difficulty by excess loss over a reference model. Because "which domain is hard" mostly depends on the domain itself and not on model size, an MATHPLACEHOLDER151ENDMATH found on a small proxy transfers easily to a much larger model.

### Quality-based Reweighting

As mentioned in previous section, the quality score (from classifier) can be used as a filter. However, that score can also directly be used as a per-sample training weight. High quality documents contribute more per epoch, while low quality ones are down-weighted but still contribute noise robust signal.
