## Why Picking Reverse KL for Post Training Or On-Policy Distillation?

### Mathematical Perspective

The answer from mathematical perspective is actually already implied in the above sections. In CoT, the correct reasoning paths are rare and often rely on few essential tokens, hence the ‘average-seeking distribution’ is not ideal for the post training or distillation purpose, where we’re targeting for improving on model reasoning ability. RL is supposed to sharpen the policy and drop bad trajectories of MATHPLACEHOLDER17ENDMATH, and reverse KL thus achieves that. Forward KL would do the opposite by forcing the policy to keep covering everything MATHPLACEHOLDER18ENDMATH covers.

### Computational Perspective

In on-policy distillation, Q refers to student model, while P refers to the teacher model, which is much heavier than student model. When computing KL divergence, the cost depends on which distribution to sample from.
